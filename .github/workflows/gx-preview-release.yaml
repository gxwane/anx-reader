name: GX Preview Release

on:
  push:
    tags:
      - 'gx-v[0-9]*.[0-9]*.[0-9]*-preview.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Preview version without the gx-v prefix (for example 0.1.0-preview.1)
        required: true
        type: string
      upstream_base:
        description: Upstream Anxcye/anx-reader commit used as the synchronization base
        required: false
        type: string
      release_notes:
        description: User-facing release notes (optional, fallback to CHANGELOG.md)
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: gx-preview-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.3

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_notes_b64: ${{ steps.release.outputs.release_notes_b64 }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and source
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Determine trigger source and resolve VERSION
          $IS_TAG_TRIGGER = '${{ github.ref_type }}' -eq 'tag'
          if ($IS_TAG_TRIGGER) {
            $TAG = '${{ github.ref_name }}'
            if ($TAG -notmatch '^gx-v(\d+\.\d+\.\d+-preview\.\d+)$') {
              throw "Tag must match gx-v<semver>-preview.<n>: $TAG"
            }
            $VERSION = $Matches[1]
          } else {
            $VERSION = '${{ inputs.version }}'
            if ($VERSION -notmatch '^\d+\.\d+\.\d+-preview\.\d+$') {
              throw "Version must match <semver>-preview.<n>: $VERSION"
            }
            $TAG = "gx-v${VERSION}"
          }

          # Verify pubspec.yaml version matches
          $pubspecMatch = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)$'
          $PUBSPEC_VERSION = ($pubspecMatch.Matches[0].Groups[1].Value -split '\+')[0]
          if ($PUBSPEC_VERSION -ne $VERSION) {
            throw "pubspec.yaml version $PUBSPEC_VERSION does not match $VERSION."
          }

          # For manual trigger: verify tag does not already exist
          if (-not $IS_TAG_TRIGGER) {
            git rev-parse --quiet --verify "refs/tags/$TAG"
            if ($LASTEXITCODE -eq 0) {
              throw "Tag already exists: $TAG"
            }
          }

          # Extract release notes from CHANGELOG.md or fall back to manual input
          if ($IS_TAG_TRIGGER -or [string]::IsNullOrWhiteSpace('${{ inputs.release_notes }}')) {
            if (Test-Path CHANGELOG.md) {
              $changelogContent = Get-Content CHANGELOG.md -Raw
              if ($changelogContent -match "(?ms)^##\s+\[$([regex]::Escape($VERSION))\][^\n]*\n(.+?)(?=\n^##\s+\[|\z)") {
                $RELEASE_NOTES = $Matches[1].Trim()
              } else {
                $RELEASE_NOTES = "See CHANGELOG.md for details."
              }
            } else {
              $RELEASE_NOTES = "See commit history for details."
            }
          } else {
            $RELEASE_NOTES = '${{ inputs.release_notes }}'
          }

          "tag=$TAG" >> $env:GITHUB_OUTPUT
          "version=$VERSION" >> $env:GITHUB_OUTPUT
          $encodedNotes = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($RELEASE_NOTES))
          "release_notes_b64=$encodedNotes" >> $env:GITHUB_OUTPUT

  test:
    name: Run Quality Gauntlet on Release Commit
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve the locked dependency graph
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

  android:
    name: Build and sign Android APKs
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GX_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GX_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GX_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GX_ANDROID_KEY_ALIAS }}
        run: |
          for var_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!var_name}" ]; then
              echo "Missing required secret: GX_ANDROID_$var_name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build release APKs
        shell: bash
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ needs.validate.outputs.version }}-universal.apk
          flutter build apk --release --split-per-abi --no-pub
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ needs.validate.outputs.version }}-arm64-v8a.apk

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: gx-preview-android-assets
          path: |
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ needs.validate.outputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ needs.validate.outputs.version }}-universal.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows installer
    needs:
      - validate
      - test
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -Flutter flutter
          $source = 'build/windows/installer_output/Anx-Reader-GX-Preview-windows-${{ needs.validate.outputs.version }}-setup.exe'
          $destination = 'build/windows/release-assets/Anx-Reader-GX-Preview-windows-${{ needs.validate.outputs.version }}-setup.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: gx-preview-windows-assets
          path: build/windows/release-assets/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GX Preview prerelease
    if: ${{ always() && needs.validate.result == 'success' && needs.test.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success' }}
    needs:
      - validate
      - test
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: gx-preview-*-assets
          merge-multiple: true

      - name: Decode release notes and generate release body
        shell: bash
        env:
          RELEASE_NOTES_B64: ${{ needs.validate.outputs.release_notes_b64 }}
          VERSION: ${{ needs.validate.outputs.version }}
          UPSTREAM_BASE: ${{ inputs.upstream_base }}
        run: |
          RELEASE_NOTES=$(echo "$RELEASE_NOTES_B64" | base64 --decode)
          cat > release-body.md << 'BODYEOF'
          > [!IMPORTANT]
          > 本版本为 Anx Reader 的非官方、独立维护的 Preview 预览分支，非上游官方发版。本分支拥有独立的应用标识、数据与 WebDAV 同步命名空间以及更新通道。升级前建议先备份书库数据。
          BODYEOF
          printf '\n%s\n' "$RELEASE_NOTES" >> release-body.md
          {
            printf '\n源码提交 (Commit): `%s`\n' "$GITHUB_SHA"
            if [[ -n "$UPSTREAM_BASE" ]]; then
              printf '上游同步基准 (Upstream Base): `%s`\n' "$UPSTREAM_BASE"
            fi
            printf '上游官方项目: https://github.com/Anxcye/anx-reader\n'
            printf '\n安装前建议通过 `SHA256SUMS.txt` 校验下载文件的完整性。\n'
          } >> release-body.md

      - name: Generate metadata and SHA-256 checksums
        shell: bash
        run: |
          cat > release-assets/RELEASE-METADATA.txt << EOF
          product=Anx Reader GX Preview
          version=${{ needs.validate.outputs.version }}
          tag=${{ needs.validate.outputs.tag }}
          source_commit=${{ github.sha }}
          upstream_base=${{ inputs.upstream_base }}
          workflow_run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anx Reader GX Preview ${{ needs.validate.outputs.version }}
          prerelease: true
          draft: false
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true