name: GX Preview Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version without the gx-v prefix (for example 0.1.0-preview.1)
        required: true
        type: string
      upstream_base:
        description: Upstream Anxcye/anx-reader commit used as the synchronization base
        required: true
        type: string
      release_notes:
        description: User-facing release notes
        required: true
        type: string
      windows_bootstrap:
        description: Allow the one-time unsigned Windows bootstrap artifact
        required: true
        default: false
        type: boolean
      bootstrap_confirmation:
        description: Enter I_ACCEPT_ONE_UNSIGNED_WINDOWS_BOOTSTRAP when bootstrap is enabled
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: gx-preview-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.3

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version, source, and bootstrap exception
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_BOOTSTRAP: ${{ inputs.windows_bootstrap }}
          BOOTSTRAP_CONFIRMATION: ${{ inputs.bootstrap_confirmation }}
        run: |
          $VERSION = '${{ inputs.version }}'
          $UPSTREAM_BASE = '${{ inputs.upstream_base }}'
          if ($VERSION -notmatch '^\d+\.\d+\.\d+-preview\.\d+$') {
            throw "Version must match <semver>-preview.<n>: $VERSION"
          }
          if ($UPSTREAM_BASE -notmatch '^[0-9a-fA-F]{7,40}$') {
            throw "upstream_base must be a Git commit ID."
          }
          git cat-file -e "$UPSTREAM_BASE`^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "upstream_base is not present in this checkout: $UPSTREAM_BASE"
          }
          if ('${{ github.ref }}' -ne 'refs/heads/develop') {
            throw "GX Preview releases must run from the develop branch."
          }

          $pubspecMatch = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)$'
          $PUBSPEC_VERSION = ($pubspecMatch.Matches[0].Groups[1].Value -split '\+')[0]
          if ($PUBSPEC_VERSION -ne $VERSION) {
            throw "pubspec.yaml version $PUBSPEC_VERSION does not match $VERSION."
          }

          $TAG = "gx-v${VERSION}"
          git rev-parse --quiet --verify "refs/tags/$TAG"
          if ($LASTEXITCODE -eq 0) {
            throw "Tag already exists: $TAG"
          }

          if ($env:WINDOWS_BOOTSTRAP -eq 'true') {
            if ($env:BOOTSTRAP_CONFIRMATION -ne 'I_ACCEPT_ONE_UNSIGNED_WINDOWS_BOOTSTRAP') {
              throw "The unsigned bootstrap confirmation text is missing."
            }
            $existingBootstrap = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" `
              --jq '.[].assets[].name' | Select-String 'unsigned-bootstrap\.exe$'
            if ($existingBootstrap) {
              throw "An unsigned Windows bootstrap release already exists."
            }
          }

          "tag=$TAG" >> $env:GITHUB_OUTPUT

  android:
    name: Build signed Android APKs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve the locked dependency graph
        run: flutter pub get --enforce-lockfile

      - name: Configure fork-owned Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GX_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GX_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GX_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GX_ANDROID_KEY_ALIAS }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required Android signing secret: GX_ANDROID_${value}" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build release APKs
        shell: bash
        run: |
          flutter gen-l10n
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ inputs.version }}-universal.apk
          flutter build apk --release --split-per-abi --no-pub
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ inputs.version }}-arm64-v8a.apk

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: gx-preview-android-assets
          path: |
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ inputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/Anx-Reader-GX-Preview-android-${{ inputs.version }}-universal.apk
          if-no-files-found: error
          retention-days: 14

  windows-bootstrap:
    name: Build one-time unsigned Windows bootstrap
    if: ${{ inputs.windows_bootstrap == true }}
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build unsigned bootstrap installer
        shell: pwsh
        run: |
          ./scripts/build_windows_installer.ps1 -Flutter flutter
          $source = 'build/windows/installer_output/Anx-Reader-GX-Preview-windows-${{ inputs.version }}-setup.exe'
          $destination = 'build/windows/release-assets/Anx-Reader-GX-Preview-windows-${{ inputs.version }}-unsigned-bootstrap.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination
          if ((Get-AuthenticodeSignature -FilePath $destination).Status -ne 'NotSigned') {
            throw 'The bootstrap path must contain an unsigned installer.'
          }

      - name: Upload unsigned bootstrap asset
        uses: actions/upload-artifact@v7
        with:
          name: gx-preview-windows-bootstrap-assets
          path: build/windows/release-assets/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-signed:
    name: Build and SignPath-sign Windows installer
    if: ${{ inputs.windows_bootstrap == false }}
    needs: validate
    runs-on: windows-latest
    environment: gx-preview-signing
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.GX_SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.GX_SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.GX_SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.GX_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fail closed when fork signing configuration is incomplete
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.GX_SIGNPATH_API_TOKEN }}
        run: |
          $required = @{
            GX_SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            GX_SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            GX_SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            GX_SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            GX_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })
          if ($missing.Count -gt 0) {
            throw "Missing fork-owned SignPath configuration: $($missing -join ', ')"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build unsigned installer for the signing request
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -Flutter flutter

      - name: Upload unsigned installer to GitHub Actions
        id: upload-unsigned-windows
        uses: actions/upload-artifact@v7
        with:
          name: gx-preview-windows-signing-request-${{ inputs.version }}
          path: build/windows/installer_output/Anx-Reader-GX-Preview-windows-${{ inputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.GX_SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/windows/signed

      - name: Verify and stage the signed installer
        shell: pwsh
        run: |
          $candidates = @(Get-ChildItem -Path build/windows/signed -Filter '*.exe' -File -Recurse)
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one signed installer; found $($candidates.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $candidates[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "SignPath output has invalid Authenticode status: $($signature.Status)."
          }
          $destination = 'build/windows/release-assets/Anx-Reader-GX-Preview-windows-${{ inputs.version }}-setup.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $candidates[0].FullName -Destination $destination

      - name: Upload signed Windows asset
        uses: actions/upload-artifact@v7
        with:
          name: gx-preview-windows-signed-assets
          path: build/windows/release-assets/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GX Preview prerelease
    if: ${{ always() && needs.validate.result == 'success' && needs.android.result == 'success' && (needs.windows-bootstrap.result == 'success' || needs.windows-signed.result == 'success') }}
    needs:
      - validate
      - android
      - windows-bootstrap
      - windows-signed
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: gx-preview-*-assets
          merge-multiple: true

      - name: Generate metadata and SHA-256 checksums
        shell: bash
        env:
          WINDOWS_BOOTSTRAP: ${{ inputs.windows_bootstrap }}
        run: |
          cat > release-assets/RELEASE-METADATA.txt <<EOF
          product=Anx Reader GX Preview
          version=${{ inputs.version }}
          tag=${{ needs.validate.outputs.tag }}
          source_commit=${{ github.sha }}
          upstream_base=${{ inputs.upstream_base }}
          windows_unsigned_bootstrap=$WINDOWS_BOOTSTRAP
          workflow_run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anx Reader GX Preview ${{ inputs.version }}
          prerelease: true
          draft: false
          body: |
            > [!IMPORTANT]
            > This is an unofficial, independently maintained Preview fork of Anx Reader, not an upstream release. It uses a separate app identity, data and synchronization namespace, and release channel. Back up your library before updating.

            ${{ inputs.release_notes }}

            Source commit: `${{ github.sha }}`
            Upstream synchronization base: `${{ inputs.upstream_base }}`
            Upstream project: https://github.com/Anxcye/anx-reader
            Windows unsigned bootstrap exception: `${{ inputs.windows_bootstrap }}`

            Verify every downloaded file against `SHA256SUMS.txt` before installation.
          files: release-assets/*
          fail_on_unmatched_files: true
